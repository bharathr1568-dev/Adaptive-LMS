<!DOCTYPE html>
<html>
<head>
    <title>Create Account - College LMS</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #141e30, #243b55);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            text-align: center;
            color: white;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input, select {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 25px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 14px;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        select {
            appearance: none;
        }

        input:focus, select:focus {
            background: rgba(255,255,255,0.25);
            box-shadow: 0 0 10px #00ffd5;
        }

        button {
            padding: 12px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            background: linear-gradient(45deg, #00ffd5, #00bfff);
            color: black;
            transition: 0.3s ease;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 15px #00ffd5;
        }

        p {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #00ffd5;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: white;
        }

        #parentField {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

    </style>
</head>

<body>

<div class="card floating">
    <h2>✨ Create Account</h2>

    <form method="post">
        <input name="name" placeholder="Full Name" required>
        <input name="email" placeholder="Email / Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <select name="role" id="roleSelect" required>
            <option value="">Select Role</option>
            <option value="student">🎓 Student</option>
            <option value="teacher">👨‍🏫 Teacher</option>
            <option value="parent">👨‍👩‍👧 Parent</option>
        </select>

        <!-- Parent extra field -->
        <div id="parentField">
            <input name="child_email" placeholder="Enter Student Email (for Parent)">
        </div>

        <button>🚀 Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="/">Back to Login</a>
    </p>
</div>

<script>
document.getElementById("roleSelect").onchange = function(){
    if(this.value == "parent"){
        document.getElementById("parentField").style.display = "block";
    } else {
        document.getElementById("parentField").style.display = "none";
    }
}
</script>

</body>
</html>
